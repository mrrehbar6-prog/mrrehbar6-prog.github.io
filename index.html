<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#17161a"><meta name="apple-mobile-web-app-capable" content="yes"><title>Habit Tracker</title><link rel="manifest" href="manifest.json">
<style>
:root{--bg:#17161a;--panel:#211f24;--line:#49454b;--text:#f2ede6;--dim:#9b969b;--red:#e0342f}*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif}body{padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom);overscroll-behavior:none}button,input{font:inherit}button{cursor:pointer}.hidden{display:none!important}
#splash{position:fixed;inset:0;z-index:99999;background:var(--red);display:flex;align-items:center;justify-content:center;opacity:1;visibility:visible;transition:.35s}#splash.hide{opacity:0;visibility:hidden;pointer-events:none}.splash-logo{width:108px;height:108px;border:9px solid #fff;border-radius:25px}.app{max-width:520px;min-height:100vh;margin:auto;padding:24px 18px 50px}.header{display:flex;align-items:center;justify-content:space-between;margin-bottom:28px}.header h1{margin:0;font-size:30px}.add-btn{width:46px;height:46px;border:0;border-radius:14px;background:var(--red);color:#fff;font-size:28px}.habit-list{display:flex;flex-direction:column;gap:12px}.habit-card{width:100%;padding:18px;border:1px solid var(--line);border-radius:16px;background:var(--panel);color:var(--text);text-align:left;position:relative;user-select:none;-webkit-user-select:none;touch-action:none;transition:.15s}.habit-card.dragging{opacity:.75;border-color:var(--red);box-shadow:0 15px 40px #0008;transform:scale(1.02);z-index:1000}.drag-hint{position:absolute;top:15px;right:15px;color:#777277;font-size:19px}.habit-title{font-size:20px;font-weight:700;padding-right:32px}.habit-info{margin-top:7px;color:var(--dim);font-size:14px}.progress-row{display:flex;align-items:center;gap:12px;margin-top:14px}.progress-bar{flex:1;height:7px;background:#39363b;border-radius:99px;overflow:hidden}.progress-fill{height:100%;background:var(--red);border-radius:99px}.progress-percent{min-width:44px;text-align:right;color:var(--red);font-size:14px;font-weight:800}.empty{color:var(--dim);text-align:center;padding:50px 20px;line-height:1.6}.back-btn{background:none;border:0;color:var(--text);font-size:16px;padding:0;margin-bottom:24px}.habit-heading{font-size:30px;font-weight:750;margin-bottom:8px;word-break:break-word}.locked-days{color:var(--dim);font-size:15px;margin-bottom:24px}.count{font-size:16px;margin-bottom:12px}.count b{color:var(--red);font-size:21px}.big-progress{display:flex;align-items:center;gap:12px;margin-bottom:24px}.big-progress-bar{flex:1;height:10px;background:#39363b;border-radius:99px;overflow:hidden}.big-progress-fill{height:100%;background:var(--red);border-radius:99px}.big-progress-percent{color:var(--red);font-size:18px;font-weight:800;min-width:48px;text-align:right}.grid{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;margin-bottom:30px}.cell{aspect-ratio:1;border:2px solid #4b474d;border-radius:10px;display:flex;align-items:center;justify-content:center;background:#242227;color:#f2ede6;font-size:16px;font-weight:700}.cell.done{background:var(--red);border-color:var(--red);color:#fff}.delete-btn{width:100%;padding:13px;border:1px solid var(--line);border-radius:10px;background:transparent;color:var(--dim)}.delete-btn.confirm{border-color:var(--red);color:var(--red)}.overlay{position:fixed;inset:0;background:#000b;display:none;align-items:flex-end;justify-content:center;z-index:100}.overlay.show{display:flex}.modal{width:min(520px,100%);background:var(--panel);border-radius:20px 20px 0 0;padding:24px 20px calc(24px + env(safe-area-inset-bottom))}.modal h2{margin:0 0 22px;font-size:22px}.label{display:block;color:var(--dim);font-size:13px;margin-bottom:7px}.input{width:100%;padding:13px 0;border:0;border-bottom:2px solid var(--line);outline:none;background:transparent;color:var(--text)}.input:focus{border-bottom-color:var(--red)}.days-input{margin-top:20px}.modal-actions{display:flex;gap:10px;margin-top:25px}.modal-actions button{flex:1;padding:13px;border-radius:9px}.cancel{border:1px solid var(--line);background:transparent;color:var(--dim)}.create{border:0;background:var(--red);color:#fff}
</style></head><body>
<div id="splash"><div class="splash-logo"></div></div><div class="app"><section id="homePage"><div class="header"><h1>My Habits</h1><button class="add-btn" id="addHabitBtn">+</button></div><div class="habit-list" id="habitList"></div></section><section id="habitPage" class="hidden"><button class="back-btn" id="backBtn">← Back</button><div class="habit-heading" id="habitTitle"></div><div class="locked-days"><span id="habitDays"></span> days · 🔒 fixed after creation</div><div class="count"><b id="doneCount">0</b> / <span id="totalCount">0</span> days done</div><div class="big-progress"><div class="big-progress-bar"><div class="big-progress-fill" id="bigProgressFill"></div></div><div class="big-progress-percent" id="bigProgressPercent">0%</div></div><div class="grid" id="dayGrid"></div><button class="delete-btn" id="deleteBtn">Delete habit</button></section></div>
<div class="overlay" id="overlay"><div class="modal"><h2>Create habit</h2><label class="label">Habit name</label><input class="input" id="newHabitName" maxlength="40" placeholder="Example: Study"><div class="days-input"><label class="label">How many days?</label><input class="input" id="newHabitDays" type="number" min="1" max="3650" placeholder="Example: 30"></div><div class="modal-actions"><button class="cancel" id="cancelBtn">Cancel</button><button class="create" id="createBtn">Create</button></div></div></div>
<script>
(()=>{const K='habit_tracker_v3';let H=[],cur=null,confirmDel=false;const d={card:null,pointer:null,y:0,timer:null,active:false,moved:false},$=x=>document.getElementById(x);function id(){return Date.now().toString(36)+'-'+Math.random().toString(36).slice(2)}function load(){try{H=JSON.parse(localStorage.getItem(K)||'[]');if(!Array.isArray(H))H=[];H=H.map(h=>({id:h.id||id(),name:String(h.name||'Habit'),days:Math.max(1,Number(h.days)||1),done:Array.isArray(h.done)?h.done:[]}));H.forEach(h=>{while(h.done.length<h.days)h.done.push(false);h.done.length=h.days})}catch(e){H=[]}}function save(){localStorage.setItem(K,JSON.stringify(H))}function get(x){return H.find(h=>h.id===x)}function n(h){return h.done.filter(Boolean).length}function p(h){return Math.round(n(h)/h.days*100)}function esc(x){return String(x).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#039;')}
function home(){let l=$('habitList');l.innerHTML='';if(!H.length){l.innerHTML=' <div class="empty">No habits yet.<br>Tap <b>+</b> to create your first habit.</div>';return}H.forEach(h=>{let c=document.createElement('button');c.className='habit-card';c.type='button';c.dataset.id=h.id;let q=p(h);c.innerHTML='<div class="drag-hint">⋮⋮</div><div class="habit-title">'+esc(h.name)+'</div><div class="habit-info">'+n(h)+' / '+h.days+' days completed</div><div class="progress-row"><div class="progress-bar"><div class="progress-fill" style="width:'+q+'%"></div></div><div class="progress-percent">'+q+'%</div></div>';c.onclick=()=>{if(!d.moved)open(h.id)};c.onpointerdown=down;c.onpointermove=move;c.onpointerup=up;c.onpointercancel=cancel;l.appendChild(c)})}
function down(e){if(e.pointerType==='mouse'&&e.button!==0)return;clearTimeout(d.timer);d.card=e.currentTarget;d.pointer=e.pointerId;d.y=e.clientY;d.active=false;d.moved=false;d.timer=setTimeout(()=>{if(d.card===e.currentTarget){d.active=true;d.moved=true;d.card.classList.add('dragging');document.body.style.overflow='hidden';navigator.vibrate&&navigator.vibrate(20)}},350);try{d.card.setPointerCapture(e.pointerId)}catch(_){} }
function move(e){if(d.card!==e.currentTarget||e.pointerId!==d.pointer)return;if(!d.active){if(Math.abs(e.clientY-d.y)>10){clearTimeout(d.timer);d.moved=true}return}e.preventDefault();let z=document.elementFromPoint(e.clientX,e.clientY),t=z&&z.closest('.habit-card');if(!t||t===d.card||t.parentElement!==$('habitList'))return;let r=t.getBoundingClientRect();e.clientY<r.top+r.height/2?$('habitList').insertBefore(d.card,t):$('habitList').insertBefore(d.card,t.nextSibling)}
function order(){let ids=[...$('habitList').querySelectorAll('.habit-card')].map(x=>x.dataset.id),m=new Map(H.map(h=>[h.id,h]));H=ids.map(x=>m.get(x)).filter(Boolean);save()}
function up(e){if(d.card!==e.currentTarget||e.pointerId!==d.pointer)return;clearTimeout(d.timer);let c=d.card;if(d.active){order();c.classList.remove('dragging');document.body.style.overflow='';setTimeout(()=>d.moved=false,150)}else d.moved=false;d.card=null;d.pointer=null;d.timer=null;d.active=false}function cancel(e){if(d.card!==e.currentTarget)return;clearTimeout(d.timer);if(d.active){d.card.classList.remove('dragging');document.body.style.overflow=''}d.card=null;d.pointer=null;d.timer=null;d.active=false;d.moved=false}
function open(x){let h=get(x);if(!h)return;cur=x;confirmDel=false;$('homePage').classList.add('hidden');$('habitPage').classList.remove('hidden');$('deleteBtn').textContent='Delete habit';$('deleteBtn').classList.remove('confirm');render()}function render(){let h=get(cur);if(!h)return home();$('habitTitle').textContent=h.name;$('habitDays').textContent=h.days;$('totalCount').textContent=h.days;$('doneCount').textContent=n(h);$('bigProgressFill').style.width=p(h)+'%';$('bigProgressPercent').textContent=p(h)+'%';let g=$('dayGrid');g.innerHTML='';for(let i=0;i<h.days;i++){let b=document.createElement('button');b.className='cell'+(h.done[i]?' done':'');b.textContent=i+1;b.onclick=()=>{h.done[i]=!h.done[i];save();render();home()};g.appendChild(b)}}
function create(){let name=$('newHabitName').value.trim(),days=parseInt($('newHabitDays').value,10);if(!name){alert('Please enter a habit name.');return}if(!Number.isFinite(days)||days<1||days>3650){alert('Enter days between 1 and 3650.');return}let h={id:id(),name,days,done:new Array(days).fill(false)};H.unshift(h);save();$('overlay').classList.remove('show');home();open(h.id)}function go(){cur=null;confirmDel=false;$('habitPage').classList.add('hidden');$('homePage').classList.remove('hidden');home()}function del(){if(!cur)return;if(!confirmDel){confirmDel=true;$('deleteBtn').textContent='Tap again to delete';$('deleteBtn').classList.add('confirm');return}H=H.filter(h=>h.id!==cur);save();go()}
$('addHabitBtn').onclick=()=>{$('overlay').classList.add('show');$('newHabitName').value='';$('newHabitDays').value='';setTimeout(()=>$('newHabitName').focus(),100)};$('cancelBtn').onclick=()=>$('overlay').classList.remove('show');$('createBtn').onclick=create;$('backBtn').onclick=go;$('deleteBtn').onclick=del;$('overlay').onclick=e=>{if(e.target===$('overlay'))$('overlay').classList.remove('show')};$('newHabitName').onkeydown=e=>{if(e.key==='Enter')$('newHabitDays').focus()};$('newHabitDays').onkeydown=e=>{if(e.key==='Enter')create()};load();home();setTimeout(()=>$('splash').classList.add('hide'),900);setTimeout(()=>$('splash').classList.add('hide'),1800);if('serviceWorker'in navigator)addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));})();
</script></body></html>
