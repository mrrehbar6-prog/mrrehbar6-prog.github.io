<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Habit Tracker</title>
<meta name="theme-color" content="#17161a">
<link rel="manifest" href="manifest.json">

<style>
:root{
  --bg:#17161a;
  --panel:#211f24;
  --line:#49454b;
  --text:#f2ede6;
  --dim:#9b969b;
  --red:#e0342f;
}

*{
  box-sizing:border-box;
}

html,body{
  margin:0;
  min-height:100%;
  background:var(--bg);
  color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
}

button,input{
  font:inherit;
}

body{
  padding-top:env(safe-area-inset-top);
  padding-bottom:env(safe-area-inset-bottom);
}

.app{
  max-width:560px;
  margin:auto;
  padding:24px 18px 60px;
}

/* HOME */

.header{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:28px;
}

.title{
  font-size:30px;
  font-weight:700;
  margin:0;
}

.add-btn{
  width:48px;
  height:48px;
  border:1px solid var(--line);
  border-radius:12px;
  background:var(--panel);
  color:var(--text);
  font-size:30px;
  line-height:1;
  cursor:pointer;
}

.habit-list{
  display:flex;
  flex-direction:column;
  gap:12px;
}

.habit-card{
  border:1px solid var(--line);
  border-radius:14px;
  background:var(--panel);
  padding:18px;
  cursor:pointer;
  transition:.12s;
}

.habit-card:active{
  transform:scale(.98);
}

.habit-card-title{
  font-size:20px;
  font-weight:600;
}

.habit-card-info{
  margin-top:8px;
  color:var(--dim);
  font-size:14px;
}

.empty{
  color:var(--dim);
  text-align:center;
  padding:60px 20px;
}

/* TRACKER */

.back{
  background:none;
  border:none;
  color:var(--dim);
  padding:0;
  font-size:15px;
  margin-bottom:24px;
  cursor:pointer;
}

.habit-title{
  display:flex;
  align-items:center;
  gap:10px;
  margin-bottom:24px;
}

.habit-title input{
  flex:1;
  min-width:0;
  background:none;
  border:none;
  border-bottom:2px solid var(--line);
  outline:none;
  color:var(--text);
  font-size:30px;
  font-weight:700;
  padding:4px 0;
}

.habit-title input:focus{
  border-bottom-color:var(--red);
}

.delete-btn{
  border:none;
  background:none;
  color:var(--dim);
  font-size:13px;
  text-decoration:underline;
}

.days-setting{
  display:flex;
  align-items:center;
  gap:8px;
  color:var(--dim);
  font-size:15px;
  margin-bottom:22px;
}

.days-setting input{
  width:80px;
  background:none;
  border:none;
  border-bottom:2px solid var(--line);
  color:var(--text);
  outline:none;
  padding:4px;
  text-align:center;
}

.days-setting input:focus{
  border-bottom-color:var(--red);
}

.count{
  font-size:16px;
  margin-bottom:16px;
}

.count b{
  color:var(--red);
  font-size:21px;
}

.grid{
  display:grid;
  grid-template-columns:repeat(6,1fr);
  gap:8px;
  margin-bottom:28px;
}

.cell{
  aspect-ratio:1;
  border:2px solid var(--line);
  border-radius:7px;
  display:flex;
  justify-content:center;
  align-items:center;
  color:var(--dim);
  font-size:14px;
  font-weight:600;
  cursor:pointer;
  user-select:none;
  transition:.1s;
}

.cell:active{
  transform:scale(.9);
}

.cell.done{
  background:var(--red);
  border-color:var(--red);
  color:white;
}

.reset-btn{
  background:none;
  border:1px solid var(--line);
  color:var(--dim);
  border-radius:7px;
  padding:9px 14px;
  font-size:13px;
}

/* ADD HABIT */

.form-title{
  font-size:30px;
  font-weight:700;
  margin-bottom:30px;
}

.form input{
  width:100%;
  background:none;
  border:none;
  border-bottom:2px solid var(--line);
  color:var(--text);
  outline:none;
  padding:10px 0;
  font-size:18px;
  margin-bottom:28px;
}

.form input:focus{
  border-bottom-color:var(--red);
}

.create-btn{
  width:100%;
  border:none;
  border-radius:10px;
  padding:14px;
  background:var(--red);
  color:white;
  font-weight:600;
}

.cancel-btn{
  width:100%;
  margin-top:12px;
  border:1px solid var(--line);
  border-radius:10px;
  padding:13px;
  background:none;
  color:var(--dim);
}

/* DESKTOP */

@media(min-width:600px){
  .grid{
    gap:10px;
  }
}
</style>
</head>

<body>

<div class="app" id="app"></div>

<script>
(function(){

const STORAGE_KEY = "habit_tracker_multi_v1";

let data = loadData();

function loadData(){
  try{
    const saved = localStorage.getItem(STORAGE_KEY);

    if(saved){
      const parsed = JSON.parse(saved);

      if(parsed && Array.isArray(parsed.habits)){
        return parsed;
      }
    }
  }catch(e){}

  return {
    habits:[
      {
        id:makeId(),
        name:"Gym",
        total:30,
        done:{}
      }
    ]
  };
}

function saveData(){
  localStorage.setItem(STORAGE_KEY,JSON.stringify(data));
}

function makeId(){
  return Date.now().toString(36) + Math.random().toString(36).slice(2);
}

function escapeHTML(text){
  return String(text)
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");
}

function getHabit(id){
  return data.habits.find(h => h.id === id);
}

function countDone(habit){
  return Object.keys(habit.done || {}).filter(day=>{
    return habit.done[day] === true &&
           Number(day) <= habit.total;
  }).length;
}

/* HOME */

function renderHome(){

  app.innerHTML = `
    <div class="header">
      <h1 class="title">My Habits</h1>
      <button class="add-btn" id="addHabit">+</button>
    </div>

    <div class="habit-list" id="habitList"></div>
  `;

  const list = document.getElementById("habitList");

  if(data.habits.length === 0){

    list.innerHTML = `
      <div class="empty">
        No habits yet.<br>
        Tap + to create your first habit.
      </div>
    `;

  }else{

    data.habits.forEach(habit=>{

      const done = countDone(habit);

      const card = document.createElement("div");
      card.className = "habit-card";

      card.innerHTML = `
        <div class="habit-card-title">
          ${escapeHTML(habit.name)}
        </div>

        <div class="habit-card-info">
          ${done} / ${habit.total} days done
        </div>
      `;

      card.addEventListener("click",()=>{
        renderTracker(habit.id);
      });

      list.appendChild(card);
    });
  }

  document.getElementById("addHabit")
    .addEventListener("click",renderAddHabit);
}


/* ADD HABIT */

function renderAddHabit(){

  app.innerHTML = `
    <button class="back" id="cancelTop">← Back</button>

    <div class="form-title">
      New Habit
    </div>

    <div class="form">

      <input
        id="newName"
        maxlength="40"
        placeholder="Habit name"
        autocomplete="off"
      >

      <input
        id="newDays"
        type="number"
        min="1"
        max="9999"
        value="30"
        placeholder="Number of days"
      >

      <button class="create-btn" id="createHabit">
        Create Habit
      </button>

      <button class="cancel-btn" id="cancelHabit">
        Cancel
      </button>

    </div>
  `;

  document.getElementById("cancelTop")
    .addEventListener("click",renderHome);

  document.getElementById("cancelHabit")
    .addEventListener("click",renderHome);

  document.getElementById("createHabit")
    .addEventListener("click",()=>{

      const nameInput = document.getElementById("newName");
      const daysInput = document.getElementById("newDays");

      const name = nameInput.value.trim() || "Habit";

      let total = parseInt(daysInput.value,10);

      if(!Number.isFinite(total) || total < 1){
        total = 30;
      }

      total = Math.min(9999,total);

      const habit = {
        id:makeId(),
        name:name,
        total:total,
        done:{}
      };

      data.habits.push(habit);

      saveData();

      renderTracker(habit.id);
    });

  setTimeout(()=>{
    document.getElementById("newName").focus();
  },50);
}


/* TRACKER */

function renderTracker(id){

  const habit = getHabit(id);

  if(!habit){
    renderHome();
    return;
  }

  app.innerHTML = `

    <button class="back" id="backHome">
      ← All Habits
    </button>

    <div class="habit-title">

      <input
        id="habitName"
        value="${escapeHTML(habit.name)}"
        maxlength="40"
      >

      <button class="delete-btn" id="deleteHabit">
        Delete
      </button>

    </div>

    <div class="days-setting">

      <span>Days:</span>

      <input
        id="totalDays"
        type="number"
        min="1"
        max="9999"
        value="${habit.total}"
      >

    </div>

    <div class="count">
      <b id="doneCount">${countDone(habit)}</b>
      /
      <span id="totalCount">${habit.total}</span>
      days done
    </div>

    <div class="grid" id="grid"></div>

    <button class="reset-btn" id="resetBtn">
      Reset completed days
    </button>
  `;

  document.getElementById("backHome")
    .addEventListener("click",renderHome);

  const nameInput = document.getElementById("habitName");

  nameInput.addEventListener("input",()=>{

    habit.name = nameInput.value;

    saveData();
  });

  const daysInput = document.getElementById("totalDays");

  daysInput.addEventListener("change",()=>{

    let total = parseInt(daysInput.value,10);

    if(!Number.isFinite(total) || total < 1){
      total = 1;
    }

    total = Math.min(9999,total);

    habit.total = total;

    saveData();

    renderTracker(habit.id);
  });

  document.getElementById("deleteHabit")
    .addEventListener("click",()=>{

      const ok = confirm(
        'Delete "' + habit.name + '" habit?'
      );

      if(!ok) return;

      data.habits = data.habits.filter(h=>h.id !== habit.id);

      saveData();

      renderHome();
    });

  document.getElementById("resetBtn")
    .addEventListener("click",()=>{

      const ok = confirm(
        "Reset all completed days for this habit?"
      );

      if(!ok) return;

      habit.done = {};

      saveData();

      renderTracker(habit.id);
    });

  renderGrid(habit);
}


function renderGrid(habit){

  const grid = document.getElementById("grid");

  grid.innerHTML = "";

  for(let i=1;i<=habit.total;i++){

    const cell = document.createElement("div");

    cell.className =
      "cell" +
      (habit.done[i] ? " done" : "");

    cell.textContent = i;

    cell.addEventListener("click",()=>{

      if(habit.done[i]){
        delete habit.done[i];
      }else{
        habit.done[i] = true;
      }

      saveData();

      cell.classList.toggle(
        "done",
        !!habit.done[i]
      );

      document.getElementById("doneCount")
        .textContent = countDone(habit);
    });

    grid.appendChild(cell);
  }
}


/* START */

renderHome();

})();
</script>

</body>
</html>
