<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#17161a">
<title>Habit Tracker</title>

<style>
:root{
  --bg:#17161a;
  --panel:#211f24;
  --line:#49454b;
  --text:#f2ede6;
  --dim:#9b969b;
  --red:#e0342f;
}

*{
  box-sizing:border-box;
}

html,
body{
  margin:0;
  min-height:100%;
  background:var(--bg);
  color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
}

body{
  padding-top:env(safe-area-inset-top);
  padding-bottom:env(safe-area-inset-bottom);
}

button,
input{
  font:inherit;
}

button{
  cursor:pointer;
}

.app{
  max-width:520px;
  min-height:100vh;
  margin:auto;
  padding:24px 18px 50px;
}


/* =========================
   HOME
========================= */

.header{
  display:flex;
  align-items:center;
  justify-content:space-between;
  margin-bottom:28px;
}

.header h1{
  margin:0;
  font-size:30px;
}

.add-btn{
  width:46px;
  height:46px;
  border:0;
  border-radius:14px;
  background:var(--red);
  color:white;
  font-size:28px;
  line-height:1;
}

.habit-list{
  display:flex;
  flex-direction:column;
  gap:12px;
}

.habit-card{
  width:100%;
  padding:18px;
  border:1px solid var(--line);
  border-radius:14px;
  background:var(--panel);
  color:var(--text);
  text-align:left;
}

.habit-card:active{
  transform:scale(.98);
}

.habit-title{
  font-size:20px;
  font-weight:700;
}

.habit-info{
  margin-top:7px;
  color:var(--dim);
  font-size:14px;
}


/* HOME PROGRESS */

.progress-row{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:12px;
  margin-top:14px;
}

.progress-bar{
  flex:1;
  height:7px;
  background:#39363b;
  border-radius:99px;
  overflow:hidden;
}

.progress-fill{
  height:100%;
  width:0%;
  background:var(--red);
  border-radius:99px;
  transition:width .2s ease;
}

.progress-percent{
  min-width:42px;
  text-align:right;
  color:var(--red);
  font-size:14px;
  font-weight:700;
}

.empty{
  color:var(--dim);
  text-align:center;
  padding:50px 20px;
}


/* =========================
   HABIT PAGE
========================= */

.back-btn{
  background:none;
  border:0;
  color:var(--text);
  font-size:16px;
  padding:0;
  margin-bottom:24px;
}

.habit-heading{
  font-size:30px;
  font-weight:700;
  margin-bottom:8px;
  word-break:break-word;
}

.locked-days{
  color:var(--dim);
  font-size:15px;
  margin-bottom:24px;
}

.count{
  font-size:16px;
  margin-bottom:12px;
}

.count b{
  color:var(--red);
  font-size:21px;
}


/* LARGE PROGRESS */

.big-progress{
  display:flex;
  align-items:center;
  gap:12px;
  margin-bottom:24px;
}

.big-progress-bar{
  flex:1;
  height:10px;
  background:#39363b;
  border-radius:99px;
  overflow:hidden;
}

.big-progress-fill{
  height:100%;
  width:0%;
  background:var(--red);
  border-radius:99px;
  transition:width .2s ease;
}

.big-progress-percent{
  color:var(--red);
  font-size:18px;
  font-weight:700;
  min-width:48px;
  text-align:right;
}


/* DAYS */

.grid{
  display:grid;
  grid-template-columns:repeat(6,1fr);
  gap:8px;
  margin-bottom:30px;
}

.cell{
  aspect-ratio:1;
  border:2px solid var(--line);
  border-radius:7px;
  display:flex;
  align-items:center;
  justify-content:center;
  color:var(--dim);
  font-size:15px;
  font-weight:600;
  user-select:none;
  transition:.12s;
}

.cell.done{
  background:var(--red);
  border-color:var(--red);
  color:white;
}

.cell:active{
  transform:scale(.9);
}


/* DELETE */

.delete-btn{
  width:100%;
  padding:13px;
  border:1px solid var(--line);
  border-radius:9px;
  background:transparent;
  color:var(--dim);
}

.delete-btn.confirm{
  border-color:var(--red);
  color:var(--red);
}


/* =========================
   CREATE MODAL
========================= */

.overlay{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.65);
  display:none;
  align-items:flex-end;
  justify-content:center;
  z-index:100;
}

.overlay.show{
  display:flex;
}

.modal{
  width:min(520px,100%);
  background:var(--panel);
  border-radius:20px 20px 0 0;
  padding:24px 20px calc(24px + env(safe-area-inset-bottom));
}

.modal h2{
  margin:0 0 22px;
  font-size:22px;
}

.label{
  display:block;
  color:var(--dim);
  font-size:13px;
  margin-bottom:7px;
}

.input{
  width:100%;
  padding:13px 0;
  border:0;
  border-bottom:2px solid var(--line);
  outline:none;
  background:transparent;
  color:var(--text);
}

.input:focus{
  border-bottom-color:var(--red);
}

.days-input{
  margin-top:20px;
}

.modal-actions{
  display:flex;
  gap:10px;
  margin-top:25px;
}

.modal-actions button{
  flex:1;
  padding:13px;
  border-radius:9px;
}

.cancel{
  border:1px solid var(--line);
  background:transparent;
  color:var(--dim);
}

.create{
  border:0;
  background:var(--red);
  color:white;
}

.hidden{
  display:none!important;
}
</style>
</head>

<body>

<div class="app">

  <!-- =========================
       HOME PAGE
  ========================== -->

  <section id="homePage">

    <div class="header">
      <h1>My Habits</h1>

      <button
        class="add-btn"
        id="addHabitBtn"
        type="button">
        +
      </button>
    </div>

    <div
      class="habit-list"
      id="habitList">
    </div>

  </section>


  <!-- =========================
       HABIT PAGE
  ========================== -->

  <section
    id="habitPage"
    class="hidden">

    <button
      class="back-btn"
      id="backBtn"
      type="button">
      ← Back
    </button>

    <div
      class="habit-heading"
      id="habitTitle">
    </div>

    <div class="locked-days">
      <span id="habitDays"></span>
      days · 🔒 fixed after creation
    </div>

    <div class="count">
      <b id="doneCount">0</b>
      /
      <span id="totalCount">0</span>
      days done
    </div>


    <!-- PROGRESS -->

    <div class="big-progress">

      <div class="big-progress-bar">
        <div
          class="big-progress-fill"
          id="bigProgressFill">
        </div>
      </div>

      <div
        class="big-progress-percent"
        id="bigProgressPercent">
        0%
      </div>

    </div>


    <!-- DAYS -->

    <div
      class="grid"
      id="dayGrid">
    </div>


    <!-- DELETE -->

    <button
      class="delete-btn"
      id="deleteBtn"
      type="button">
      Delete habit
    </button>

  </section>

</div>


<!-- =========================
     CREATE HABIT MODAL
========================== -->

<div
  class="overlay"
  id="overlay">

  <div class="modal">

    <h2>Create habit</h2>

    <label class="label">
      Habit name
    </label>

    <input
      class="input"
      id="newHabitName"
      maxlength="40"
      placeholder="Example: Study"
      autocomplete="off"
    >


    <div class="days-input">

      <label class="label">
        How many days?
      </label>

      <input
        class="input"
        id="newHabitDays"
        type="number"
        min="1"
        inputmode="numeric"
        placeholder="Example: 30"
      >

    </div>


    <div class="modal-actions">

      <button
        class="cancel"
        id="cancelBtn"
        type="button">
        Cancel
      </button>

      <button
        class="create"
        id="createBtn"
        type="button">
        Create
      </button>

    </div>

  </div>

</div>


<script>

(function(){

  /*
  ========================================
  STORAGE
  ========================================
  */

  const STORAGE_KEY = "habit_tracker_v3";


  /*
  ========================================
  ELEMENTS
  ========================================
  */

  const homePage =
    document.getElementById("homePage");

  const habitPage =
    document.getElementById("habitPage");

  const habitList =
    document.getElementById("habitList");

  const addHabitBtn =
    document.getElementById("addHabitBtn");

  const overlay =
    document.getElementById("overlay");

  const newHabitName =
    document.getElementById("newHabitName");

  const newHabitDays =
    document.getElementById("newHabitDays");

  const cancelBtn =
    document.getElementById("cancelBtn");

  const createBtn =
    document.getElementById("createBtn");

  const backBtn =
    document.getElementById("backBtn");

  const habitTitle =
    document.getElementById("habitTitle");

  const habitDays =
    document.getElementById("habitDays");

  const doneCount =
    document.getElementById("doneCount");

  const totalCount =
    document.getElementById("totalCount");

  const dayGrid =
    document.getElementById("dayGrid");

  const deleteBtn =
    document.getElementById("deleteBtn");

  const bigProgressFill =
    document.getElementById("bigProgressFill");

  const bigProgressPercent =
    document.getElementById("bigProgressPercent");


  /*
  ========================================
  STATE
  ========================================
  */

  let state = loadState();

  let currentHabitId = null;

  let deleteConfirm = false;

  let deleteTimer = null;


  /*
  ========================================
  LOAD DATA
  ========================================
  */

  function loadState(){

    try{

      const raw =
        localStorage.getItem(STORAGE_KEY);

      if(raw){

        const data =
          JSON.parse(raw);

        if(
          data &&
          Array.isArray(data.habits)
        ){

          return data;

        }

      }

    }catch(error){}

    return {
      habits:[]
    };

  }


  /*
  ========================================
  SAVE DATA
  ========================================
  */

  function saveState(){

    try{

      localStorage.setItem(
        STORAGE_KEY,
        JSON.stringify(state)
      );

    }catch(error){}

  }


  /*
  ========================================
  CREATE UNIQUE ID
  ========================================
  */

  function makeId(){

    return (
      Date.now().toString(36) +
      Math.random()
        .toString(36)
        .slice(2)
    );

  }


  /*
  ========================================
  GET CURRENT HABIT
  ========================================
  */

  function getCurrentHabit(){

    return state.habits.find(
      habit =>
        habit.id === currentHabitId
    );

  }


  /*
  ========================================
  CALCULATE PROGRESS
  ========================================
  */

  function getProgress(habit){

    const total =
      habit.days;

    const completed =
      Object.keys(
        habit.done || {}
      ).filter(
        day => habit.done[day]
      ).length;

    const percentage =
      total > 0
      ? Math.round(
          (completed / total) * 100
        )
      : 0;

    return {
      completed,
      percentage
    };

  }


  /*
  ========================================
  SHOW HOME
  ========================================
  */

  function showHome(){

    currentHabitId = null;

    habitPage.classList.add(
      "hidden"
    );

    homePage.classList.remove(
      "hidden"
    );

    renderHome();

  }


  /*
  ========================================
  OPEN HABIT
  ========================================
  */

  function showHabit(
    id,
    addHistory = true
  ){

    const habit =
      state.habits.find(
        h => h.id === id
      );

    if(!habit){

      showHome();

      return;

    }


    currentHabitId = id;


    homePage.classList.add(
      "hidden"
    );

    habitPage.classList.remove(
      "hidden"
    );


    renderHabit();


    /*
    Add browser history entry.

    This makes:

    Habit
      ↓ Back
    Home
      ↓ Back
    Exit app/browser
    */

    if(addHistory){

      history.pushState(
        {
          page:"habit",
          id:id
        },
        "",
        "#habit-" + id
      );

    }

  }


  /*
  ========================================
  HOME PAGE RENDER
  ========================================
  */

  function renderHome(){

    habitList.innerHTML = "";


    if(state.habits.length === 0){

      habitList.innerHTML =
        `
        <div class="empty">
          No habits yet.<br>
          Tap + to create your first habit.
        </div>
        `;

      return;

    }


    state.habits.forEach(
      habit => {

        const card =
          document.createElement(
            "button"
          );

        card.className =
          "habit-card";

        card.type = "button";


        const progress =
          getProgress(habit);


        card.innerHTML = `

          <div class="habit-title"></div>

          <div class="habit-info">
            ${progress.completed}
            /
            ${habit.days}
            days done
          </div>

          <div class="progress-row">

            <div class="progress-bar">

              <div
                class="progress-fill"
                style="width:${progress.percentage}%">
              </div>

            </div>

            <div class="progress-percent">
              ${progress.percentage}%
            </div>

          </div>

        `;


        card.querySelector(
          ".habit-title"
        ).textContent =
          habit.name;


        card.addEventListener(
          "click",
          () => {

            showHabit(
              habit.id
            );

          }
        );


        habitList.appendChild(
          card
        );

      }
    );

  }


  /*
  ========================================
  HABIT PAGE RENDER
  ========================================
  */

  function renderHabit(){

    const habit =
      getCurrentHabit();


    if(!habit){

      showHome();

      return;

    }


    const progress =
      getProgress(habit);


    habitTitle.textContent =
      habit.name;

    habitDays.textContent =
      habit.days;

    totalCount.textContent =
      habit.days;

    doneCount.textContent =
      progress.completed;


    /*
    Percentage
    */

    bigProgressPercent.textContent =
      progress.percentage + "%";


    bigProgressFill.style.width =
      progress.percentage + "%";


    /*
    Create day boxes
    */

    dayGrid.innerHTML = "";


    for(
      let day = 1;
      day <= habit.days;
      day++
    ){

      const cell =
        document.createElement(
          "div"
        );


      const isDone =
        !!habit.done[day];


      cell.className =
        "cell" +
        (
          isDone
          ? " done"
          : ""
        );


      cell.textContent =
        day;


      cell.addEventListener(
        "click",
        () => {


          if(habit.done[day]){

            delete habit.done[day];

          }else{

            habit.done[day] =
              true;

          }


          saveState();


          renderHabit();

        }
      );


      dayGrid.appendChild(
        cell
      );

    }

  }


  /*
  ========================================
  CREATE HABIT
  ========================================
  */

  addHabitBtn.addEventListener(
    "click",
    () => {

      overlay.classList.add(
        "show"
      );

      newHabitName.value = "";

      newHabitDays.value = "";


      setTimeout(
        () => {

          newHabitName.focus();

        },
        100
      );

    }
  );


  /*
  ========================================
  CANCEL CREATE
  ========================================
  */

  cancelBtn.addEventListener(
    "click",
    () => {

      overlay.classList.remove(
        "show"
      );

    }
  );


  /*
  ========================================
  CLOSE MODAL
  ========================================
  */

  overlay.addEventListener(
    "click",
    event => {

      if(
        event.target ===
        overlay
      ){

        overlay.classList.remove(
          "show"
        );

      }

    }
  );


  /*
  ========================================
  CREATE
  ========================================
  */

  createBtn.addEventListener(
    "click",
    () => {

      const name =
        newHabitName.value.trim();


      const days =
        parseInt(
          newHabitDays.value,
          10
        );


      if(!name){

        alert(
          "Habit name likho."
        );

        newHabitName.focus();

        return;

      }


      if(
        !Number.isFinite(days) ||
        days < 1
      ){

        alert(
          "Days 1 ya usse zyada hone chahiye."
        );

        newHabitDays.focus();

        return;

      }


      /*
      New habit.

      DAYS ARE SAVED HERE.

      There is intentionally
      NO edit-days feature.
      */

      const habit = {

        id:makeId(),

        name:name,

        days:days,

        done:{}

      };


      state.habits.push(
        habit
      );


      saveState();


      overlay.classList.remove(
        "show"
      );


      renderHome();


      /*
      Open newly-created habit
      */

      showHabit(
        habit.id
      );

    }
  );


  /*
  ========================================
  BACK BUTTON
  ========================================
  */

  backBtn.addEventListener(
    "click",
    () => {

      history.back();

    }
  );


  /*
  ========================================
  ANDROID / BROWSER BACK
  ========================================
  */

  window.addEventListener(
    "popstate",
    () => {

      if(
        currentHabitId !== null
      ){

        currentHabitId = null;

        habitPage.classList.add(
          "hidden"
        );

        homePage.classList.remove(
          "hidden"
        );

        renderHome();

      }else{

        showHome();

      }

    }
  );


  /*
  ========================================
  DELETE HABIT
  ========================================
  */

  deleteBtn.addEventListener(
    "click",
    () => {


      if(!deleteConfirm){

        deleteConfirm = true;


        deleteBtn.textContent =
          "Tap again to delete";


        deleteBtn.classList.add(
          "confirm"
        );


        deleteTimer =
          setTimeout(
            () => {

              deleteConfirm =
                false;

              deleteBtn.textContent =
                "Delete habit";

              deleteBtn.classList.remove(
                "confirm"
              );

            },
            3000
          );


        return;

      }


      clearTimeout(
        deleteTimer
      );


      state.habits =
        state.habits.filter(
          habit =>
            habit.id !==
            currentHabitId
        );


      saveState();


      deleteConfirm =
        false;


      showHome();

    }
  );


  /*
  ========================================
  INITIAL LOAD
  ========================================
  */

  renderHome();

})();
</script>

</body>
</html>
