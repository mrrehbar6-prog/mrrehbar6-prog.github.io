<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#17161a">
<title>Habit Tracker</title>

<style>
:root{
  --bg:#17161a;
  --panel:#211f24;
  --line:#49454b;
  --text:#f2ede6;
  --dim:#9b969b;
  --red:#e0342f;
  --blue:#315da8;
}

*{box-sizing:border-box}

html,body{
  margin:0;
  min-height:100%;
  background:var(--bg);
  color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
}

body{
  padding-top:env(safe-area-inset-top);
  padding-bottom:env(safe-area-inset-bottom);
}

button,input{
  font:inherit;
}

button{
  cursor:pointer;
}

.app{
  max-width:520px;
  min-height:100vh;
  margin:auto;
  padding:24px 18px 50px;
}

/* HOME */

.header{
  display:flex;
  align-items:center;
  justify-content:space-between;
  margin-bottom:28px;
}

.header h1{
  margin:0;
  font-size:30px;
}

.add-btn{
  width:46px;
  height:46px;
  border:0;
  border-radius:14px;
  background:var(--red);
  color:white;
  font-size:28px;
  line-height:1;
}

.habit-list{
  display:flex;
  flex-direction:column;
  gap:12px;
}

.habit-card{
  width:100%;
  padding:18px;
  border:1px solid var(--line);
  border-radius:14px;
  background:var(--panel);
  color:var(--text);
  text-align:left;
}

.habit-card:active{
  transform:scale(.98);
}

.habit-title{
  font-size:20px;
  font-weight:700;
}

.habit-info{
  margin-top:7px;
  color:var(--dim);
  font-size:14px;
}

.empty{
  color:var(--dim);
  text-align:center;
  padding:50px 20px;
}

/* HABIT PAGE */

.back-btn{
  background:none;
  border:0;
  color:var(--text);
  font-size:16px;
  padding:0;
  margin-bottom:24px;
}

.habit-heading{
  font-size:30px;
  font-weight:700;
  margin-bottom:8px;
  word-break:break-word;
}

.locked-days{
  color:var(--dim);
  font-size:15px;
  margin-bottom:24px;
}

.count{
  font-size:16px;
  margin-bottom:16px;
}

.count b{
  color:var(--red);
  font-size:21px;
}

.grid{
  display:grid;
  grid-template-columns:repeat(6,1fr);
  gap:8px;
  margin-bottom:30px;
}

.cell{
  aspect-ratio:1;
  border:2px solid var(--line);
  border-radius:7px;
  display:flex;
  align-items:center;
  justify-content:center;
  color:var(--dim);
  font-size:15px;
  font-weight:600;
  user-select:none;
  transition:.12s;
}

.cell.done{
  background:var(--red);
  border-color:var(--red);
  color:white;
}

.cell:active{
  transform:scale(.9);
}

.delete-btn{
  width:100%;
  padding:13px;
  border:1px solid var(--line);
  border-radius:9px;
  background:transparent;
  color:var(--dim);
}

.delete-btn.confirm{
  border-color:var(--red);
  color:var(--red);
}

/* MODAL */

.overlay{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.65);
  display:none;
  align-items:flex-end;
  justify-content:center;
  z-index:100;
}

.overlay.show{
  display:flex;
}

.modal{
  width:min(520px,100%);
  background:var(--panel);
  border-radius:20px 20px 0 0;
  padding:24px 20px calc(24px + env(safe-area-inset-bottom));
}

.modal h2{
  margin:0 0 22px;
  font-size:22px;
}

.label{
  display:block;
  color:var(--dim);
  font-size:13px;
  margin-bottom:7px;
}

.input{
  width:100%;
  padding:13px 0;
  border:0;
  border-bottom:2px solid var(--line);
  outline:none;
  background:transparent;
  color:var(--text);
}

.input:focus{
  border-bottom-color:var(--red);
}

.days-input{
  margin-top:20px;
}

.modal-actions{
  display:flex;
  gap:10px;
  margin-top:25px;
}

.modal-actions button{
  flex:1;
  padding:13px;
  border-radius:9px;
}

.cancel{
  border:1px solid var(--line);
  background:transparent;
  color:var(--dim);
}

.create{
  border:0;
  background:var(--red);
  color:white;
}

/* prevent accidental horizontal overflow */
.hidden{
  display:none!important;
}
</style>
</head>

<body>

<div class="app">

  <!-- HOME -->
  <section id="homePage">

    <div class="header">
      <h1>My Habits</h1>
      <button class="add-btn" id="addHabitBtn">+</button>
    </div>

    <div class="habit-list" id="habitList"></div>

  </section>


  <!-- HABIT PAGE -->
  <section id="habitPage" class="hidden">

    <button class="back-btn" id="backBtn">← Back</button>

    <div class="habit-heading" id="habitTitle"></div>

    <div class="locked-days">
      <span id="habitDays"></span> days · 🔒 fixed after creation
    </div>

    <div class="count">
      <b id="doneCount">0</b> / <span id="totalCount">0</span> days done
    </div>

    <div class="grid" id="dayGrid"></div>

    <button class="delete-btn" id="deleteBtn">
      Delete habit
    </button>

  </section>

</div>


<!-- CREATE HABIT -->
<div class="overlay" id="overlay">

  <div class="modal">

    <h2>Create habit</h2>

    <label class="label">Habit name</label>
    <input
      class="input"
      id="newHabitName"
      maxlength="40"
      placeholder="Example: Study"
      autocomplete="off"
    >

    <div class="days-input">
      <label class="label">How many days?</label>
      <input
        class="input"
        id="newHabitDays"
        type="number"
        min="1"
        inputmode="numeric"
        placeholder="Example: 30"
      >
    </div>

    <div class="modal-actions">
      <button class="cancel" id="cancelBtn">Cancel</button>
      <button class="create" id="createBtn">Create</button>
    </div>

  </div>

</div>


<script>
(function(){

  const STORAGE_KEY = "habit_tracker_v3";

  const homePage = document.getElementById("homePage");
  const habitPage = document.getElementById("habitPage");

  const habitList = document.getElementById("habitList");

  const addHabitBtn = document.getElementById("addHabitBtn");
  const overlay = document.getElementById("overlay");

  const newHabitName = document.getElementById("newHabitName");
  const newHabitDays = document.getElementById("newHabitDays");

  const cancelBtn = document.getElementById("cancelBtn");
  const createBtn = document.getElementById("createBtn");

  const backBtn = document.getElementById("backBtn");

  const habitTitle = document.getElementById("habitTitle");
  const habitDays = document.getElementById("habitDays");

  const doneCount = document.getElementById("doneCount");
  const totalCount = document.getElementById("totalCount");

  const dayGrid = document.getElementById("dayGrid");
  const deleteBtn = document.getElementById("deleteBtn");


  let state = loadState();
  let currentHabitId = null;
  let deleteConfirm = false;
  let deleteTimer = null;


  function loadState(){

    try{

      const raw = localStorage.getItem(STORAGE_KEY);

      if(raw){

        const data = JSON.parse(raw);

        if(data && Array.isArray(data.habits)){
          return data;
        }

      }

    }catch(e){}

    return {
      habits:[]
    };

  }


  function saveState(){

    try{
      localStorage.setItem(
        STORAGE_KEY,
        JSON.stringify(state)
      );
    }catch(e){}

  }


  function makeId(){

    return Date.now().toString(36) +
           Math.random().toString(36).slice(2);

  }


  function showHome(){

    currentHabitId = null;

    habitPage.classList.add("hidden");
    homePage.classList.remove("hidden");

    renderHome();

  }


  function showHabit(id, addHistory=true){

    const habit =
      state.habits.find(h => h.id === id);

    if(!habit){
      showHome();
      return;
    }

    currentHabitId = id;

    homePage.classList.add("hidden");
    habitPage.classList.remove("hidden");

    renderHabit();

    /*
      This creates a browser history entry.
      Android back button will therefore first
      return to Home instead of closing the app.
    */

    if(addHistory){

      history.pushState(
        {page:"habit", id:id},
        "",
        "#habit-" + id
      );

    }

  }


  function renderHome(){

    habitList.innerHTML = "";

    if(state.habits.length === 0){

      habitList.innerHTML =
        '<div class="empty">No habits yet.<br>Tap + to create your first habit.</div>';

      return;

    }


    state.habits.forEach(habit => {

      const card =
        document.createElement("button");

      card.className = "habit-card";
      card.type = "button";

      const completed =
        Object.keys(habit.done || {}).filter(
          day => habit.done[day]
        ).length;

      card.innerHTML = `
        <div class="habit-title"></div>
        <div class="habit-info">
          ${completed} / ${habit.days} days done
        </div>
      `;

      card.querySelector(".habit-title")
          .textContent = habit.name;

      card.addEventListener("click", () => {

        showHabit(habit.id);

      });

      habitList.appendChild(card);

    });

  }


  function renderHabit(){

    const habit =
      state.habits.find(h => h.id === currentHabitId);

    if(!habit){

      showHome();
      return;

    }

    habitTitle.textContent = habit.name;
    habitDays.textContent = habit.days;
    totalCount.textContent = habit.days;

    dayGrid.innerHTML = "";

    let completed = 0;


    for(let day=1; day<=habit.days; day++){

      const cell =
        document.createElement("div");

      const isDone =
        !!habit.done[day];

      if(isDone) completed++;

      cell.className =
        "cell" + (isDone ? " done" : "");

      cell.textContent = day;

      cell.addEventListener("click", () => {

        if(habit.done[day]){

          delete habit.done[day];

        }else{

          habit.done[day] = true;

        }

        saveState();

        renderHabit();

      });

      dayGrid.appendChild(cell);

    }


    doneCount.textContent = completed;

  }


  /* CREATE HABIT */

  addHabitBtn.addEventListener("click", () => {

    overlay.classList.add("show");

    newHabitName.value = "";
    newHabitDays.value = "";

    setTimeout(() => {
      newHabitName.focus();
    }, 100);

  });


  cancelBtn.addEventListener("click", () => {

    overlay.classList.remove("show");

  });


  overlay.addEventListener("click", (event) => {

    if(event.target === overlay){

      overlay.classList.remove("show");

    }

  });


  createBtn.addEventListener("click", () => {

    const name =
      newHabitName.value.trim();

    const days =
      parseInt(newHabitDays.value,10);


    if(!name){

      alert("Habit name likho.");

      newHabitName.focus();

      return;

    }


    if(!Number.isFinite(days) || days < 1){

      alert("Days 1 ya usse zyada hone chahiye.");

      newHabitDays.focus();

      return;

    }


    const habit = {

      id: makeId(),

      name: name,

      /*
        IMPORTANT:
        Days are saved only at creation.
        There is NO edit-days function.
      */

      days: days,

      done:{}

    };


    state.habits.push(habit);

    saveState();

    overlay.classList.remove("show");

    renderHome();

    /*
      Open newly-created habit directly.
    */

    showHabit(habit.id);

  });


  /* BACK BUTTON */

  backBtn.addEventListener("click", () => {

    history.back();

  });


  /*
    Android/browser back behavior.

    Habit page -> Home
    Home -> normal browser/PWA back behavior
  */

  window.addEventListener("popstate", (event) => {

    if(currentHabitId !== null){

      currentHabitId = null;

      habitPage.classList.add("hidden");
      homePage.classList.remove("hidden");

      renderHome();

    }else{

      showHome();

    }

  });


  /* DELETE HABIT */

  deleteBtn.addEventListener("click", () => {

    if(!deleteConfirm){

      deleteConfirm = true;

      deleteBtn.textContent =
        "Tap again to delete";

      deleteBtn.classList.add("confirm");

      deleteTimer = setTimeout(() => {

        deleteConfirm = false;

        deleteBtn.textContent =
          "Delete habit";

        deleteBtn.classList.remove("confirm");

      },3000);

      return;

    }


    clearTimeout(deleteTimer);

    state.habits =
      state.habits.filter(
        h => h.id !== currentHabitId
      );

    saveState();

    deleteConfirm = false;

    showHome();

  });


  /* INITIAL LOAD */

  renderHome();

})();
</script>

</body>
</html>
