<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#e0342f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Habit Tracker</title>

<style>
:root{
  --bg:#17161a;
  --panel:#211f24;
  --line:#49454b;
  --text:#f2ede6;
  --dim:#9b969b;
  --red:#e0342f;
  --white:#fff;
}

*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html,body{
  margin:0;
  min-height:100%;
  background:var(--bg);
  color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
}

body{
  padding-top:env(safe-area-inset-top);
  padding-bottom:env(safe-area-inset-bottom);
  overscroll-behavior:none;
}

button,input{
  font:inherit;
}

button{
  cursor:pointer;
}

.hidden{
  display:none!important;
}

/* =========================
   PREMIUM SPLASH
========================= */

#splash{
  position:fixed;
  inset:0;
  z-index:9999;
  background:var(--red);
  display:flex;
  align-items:center;
  justify-content:center;
  overflow:hidden;
  transition:opacity .32s ease,visibility .32s ease;
}

#splash.hide{
  opacity:0;
  visibility:hidden;
  pointer-events:none;
}

.splash-logo{
  width:108px;
  height:108px;
  border:9px solid var(--white);
  border-radius:25px;
  position:relative;
  animation:
    splashIn .55s cubic-bezier(.2,.8,.2,1),
    splashPulse 1.1s ease-in-out .35s;
}

.splash-logo:after{
  content:"";
  position:absolute;
  inset:17px;
  border:3px solid rgba(255,255,255,.18);
  border-radius:9px;
}

.splash-shine{
  position:absolute;
  width:180px;
  height:180px;
  border-radius:50%;
  background:rgba(255,255,255,.08);
  animation:shine 1.2s ease-out;
}

@keyframes splashIn{
  0%{
    opacity:0;
    transform:scale(.65) rotate(-8deg);
  }
  70%{
    opacity:1;
    transform:scale(1.06) rotate(1deg);
  }
  100%{
    transform:scale(1) rotate(0);
  }
}

@keyframes splashPulse{
  0%,100%{transform:scale(1)}
  50%{transform:scale(1.035)}
}

@keyframes shine{
  from{
    transform:scale(.1);
    opacity:1;
  }
  to{
    transform:scale(3);
    opacity:0;
  }
}

/* =========================
   APP
========================= */

.app{
  max-width:520px;
  min-height:100vh;
  margin:auto;
  padding:24px 18px 50px;
}

/* HOME */

.header{
  display:flex;
  align-items:center;
  justify-content:space-between;
  margin-bottom:28px;
}

.header h1{
  margin:0;
  font-size:30px;
  letter-spacing:-.6px;
}

.add-btn{
  width:46px;
  height:46px;
  border:0;
  border-radius:14px;
  background:var(--red);
  color:#fff;
  font-size:28px;
  line-height:1;
  box-shadow:0 8px 24px rgba(224,52,47,.22);
  transition:transform .15s ease;
}

.add-btn:active{
  transform:scale(.91);
}

.habit-list{
  display:flex;
  flex-direction:column;
  gap:12px;
}

.habit-card{
  width:100%;
  padding:18px;
  border:1px solid var(--line);
  border-radius:16px;
  background:var(--panel);
  color:var(--text);
  text-align:left;
  transition:transform .15s ease,border-color .15s ease;
}

.habit-card:active{
  transform:scale(.975);
}

.habit-title{
  font-size:20px;
  font-weight:700;
}

.habit-info{
  margin-top:7px;
  color:var(--dim);
  font-size:14px;
}

.progress-row{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:12px;
  margin-top:14px;
}

.progress-bar{
  flex:1;
  height:7px;
  background:#39363b;
  border-radius:99px;
  overflow:hidden;
}

.progress-fill{
  height:100%;
  width:0;
  background:var(--red);
  border-radius:99px;
  transition:width .25s ease;
}

.progress-percent{
  min-width:44px;
  text-align:right;
  color:var(--red);
  font-size:14px;
  font-weight:800;
}

.empty{
  color:var(--dim);
  text-align:center;
  padding:50px 20px;
  line-height:1.6;
}

/* HABIT PAGE */

.back-btn{
  background:none;
  border:0;
  color:var(--text);
  font-size:16px;
  padding:0;
  margin-bottom:24px;
}

.habit-heading{
  font-size:30px;
  font-weight:750;
  margin-bottom:8px;
  word-break:break-word;
}

.locked-days{
  color:var(--dim);
  font-size:15px;
  margin-bottom:24px;
}

.count{
  font-size:16px;
  margin-bottom:12px;
}

.count b{
  color:var(--red);
  font-size:21px;
}

.big-progress{
  display:flex;
  align-items:center;
  gap:12px;
  margin-bottom:24px;
}

.big-progress-bar{
  flex:1;
  height:10px;
  background:#39363b;
  border-radius:99px;
  overflow:hidden;
}

.big-progress-fill{
  height:100%;
  width:0;
  background:var(--red);
  border-radius:99px;
  transition:width .28s ease;
}

.big-progress-percent{
  color:var(--red);
  font-size:18px;
  font-weight:800;
  min-width:48px;
  text-align:right;
}

.grid{
  display:grid;
  grid-template-columns:repeat(6,1fr);
  gap:8px;
  margin-bottom:30px;
}

.cell{
  aspect-ratio:1;
  border:2px solid var(--line);
  border-radius:8px;
  display:flex;
  align-items:center;
  justify-content:center;
  color:var(--dim);
  font-size:15px;
  font-weight:600;
  user-select:none;
  transition:transform .12s ease,background .18s ease;
}

.cell.done{
  background:var(--red);
  border-color:var(--red);
  color:#fff;
}

.cell:active{
  transform:scale(.9);
}

.delete-btn{
  width:100%;
  padding:13px;
  border:1px solid var(--line);
  border-radius:10px;
  background:transparent;
  color:var(--dim);
}

.delete-btn.confirm{
  border-color:var(--red);
  color:var(--red);
}

/* CREATE MODAL */

.overlay{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.68);
  display:none;
  align-items:flex-end;
  justify-content:center;
  z-index:100;
}

.overlay.show{
  display:flex;
}

.modal{
  width:min(520px,100%);
  background:var(--panel);
  border-radius:20px 20px 0 0;
  padding:24px 20px calc(24px + env(safe-area-inset-bottom));
  animation:modalIn .22s ease-out;
}

@keyframes modalIn{
  from{
    transform:translateY(25px);
    opacity:0;
  }
  to{
    transform:translateY(0);
    opacity:1;
  }
}

.modal h2{
  margin:0 0 22px;
  font-size:22px;
}

.label{
  display:block;
  color:var(--dim);
  font-size:13px;
  margin-bottom:7px;
}

.input{
  width:100%;
  padding:13px 0;
  border:0;
  border-bottom:2px solid var(--line);
  outline:none;
  background:transparent;
  color:var(--text);
}

.input:focus{
  border-bottom-color:var(--red);
}

.days-input{
  margin-top:20px;
}

.modal-actions{
  display:flex;
  gap:10px;
  margin-top:25px;
}

.modal-actions button{
  flex:1;
  padding:13px;
  border-radius:9px;
}

.cancel{
  border:1px solid var(--line);
  background:transparent;
  color:var(--dim);
}

.create{
  border:0;
  background:var(--red);
  color:#fff;
}
</style>
</head>

<body>

<!-- PREMIUM OPENING ANIMATION -->
<div id="splash">
  <div class="splash-shine"></div>
  <div class="splash-logo"></div>
</div>

<div class="app">

  <!-- HOME -->
  <section id="homePage">

    <div class="header">
      <h1>My Habits</h1>

      <button
        class="add-btn"
        id="addHabitBtn"
        type="button">+</button>
    </div>

    <div
      class="habit-list"
      id="habitList">
    </div>

  </section>

  <!-- HABIT PAGE -->
  <section
    id="habitPage"
    class="hidden">

    <button
      class="back-btn"
      id="backBtn"
      type="button">← Back</button>

    <div
      class="habit-heading"
      id="habitTitle"></div>

    <div class="locked-days">
      <span id="habitDays"></span>
      days · 🔒 fixed after creation
    </div>

    <div class="count">
      <b id="doneCount">0</b> /
      <span id="totalCount">0</span>
      days done
    </div>

    <div class="big-progress">

      <div class="big-progress-bar">
        <div
          class="big-progress-fill"
          id="bigProgressFill"></div>
      </div>

      <div
        class="big-progress-percent"
        id="bigProgressPercent">0%</div>

    </div>

    <div
      class="grid"
      id="dayGrid"></div>

    <button
      class="delete-btn"
      id="deleteBtn"
      type="button">
      Delete habit
    </button>

  </section>

</div>

<!-- CREATE HABIT -->
<div
  class="overlay"
  id="overlay">

  <div class="modal">

    <h2>Create habit</h2>

    <label class="label">
      Habit name
    </label>

    <input
      class="input"
      id="newHabitName"
      maxlength="40"
      placeholder="Example: Study"
      autocomplete="off">

    <div class="days-input">

      <label class="label">
        How many days?
      </label>

      <input
        class="input"
        id="newHabitDays"
        type="number"
        min="1"
        inputmode="numeric"
        placeholder="Example: 30">

    </div>

    <div class="modal-actions">

      <button
        class="cancel"
        id="cancelBtn"
        type="button">
        Cancel
      </button>

      <button
        class="create"
        id="createBtn"
        type="button">
        Create
      </button>

    </div>

  </div>
</div>

const newHabitDays=document.getElementById("newHabitDays");

const bigProgressPercent=
